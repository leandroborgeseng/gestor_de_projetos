# Configuração para Coolify
# Coolify pode usar este arquivo ou o docker-compose.yml

services:
  api:
    image: ${DOCKER_REGISTRY}/agilepm-api:${VERSION:-latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "4000:4000"
    volumes:
      - api_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  web:
    image: ${DOCKER_REGISTRY}/agilepm-web:${VERSION:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_uploads:

